<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نور — كل الروابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#0b0e16;
    --glow:#ffc978;
    --glow-soft:#ffe7be;
    --ember:#ff7a59;
    --ink:#f3efe7;
    --ink-dim:rgba(243,239,231,.56);
    --card-bg:rgba(255,231,190,.045);
    --card-border:rgba(255,201,120,.16);
    --card-border-hover:rgba(255,201,120,.55);
    --fb:#1877F2;
    --yt:#FF0033;
    --dc:#5865F2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--midnight);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:58px 18px 46px;
    position:relative;
    overflow-x:hidden;
  }

  .hero-glow{
    position:fixed;
    top:-200px;left:50%;
    width:640px;height:640px;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(255,201,120,.35) 0%, rgba(255,122,89,.12) 40%, transparent 72%);
    animation:breathe 5s ease-in-out infinite;
    z-index:0;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{opacity:.75; transform:translateX(-50%) scale(1);}
    50%{opacity:1; transform:translateX(-50%) scale(1.06);}
  }

  .embers{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .embers span{
    position:absolute;
    bottom:-10px;
    width:4px;height:4px;border-radius:50%;
    background:var(--glow);
    box-shadow:0 0 8px 2px rgba(255,201,120,.7);
    opacity:0;
    animation-name:rise;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:.9;}
    85%{opacity:.4;}
    100%{transform:translateY(-780px) translateX(var(--drift,20px)); opacity:0;}
  }

  .wrap{position:relative;z-index:2;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;}

  .logo-badge{
    display:flex;align-items:center;justify-content:center;
    margin-bottom:22px;
  }
  .logo-badge img{
    display:block;
    height:130px;
    width:auto;
    animation:logoPulse 4s ease-in-out infinite;
  }
  @keyframes logoPulse{
    0%,100%{
      filter:
        drop-shadow(0 0 14px rgba(255,201,120,.65))
        drop-shadow(0 0 32px rgba(255,159,92,.4))
        drop-shadow(0 8px 20px rgba(0,0,0,.55));
      transform:scale(1);
    }
    50%{
      filter:
        drop-shadow(0 0 20px rgba(255,201,120,.9))
        drop-shadow(0 0 46px rgba(255,159,92,.6))
        drop-shadow(0 8px 20px rgba(0,0,0,.55));
      transform:scale(1.03);
    }
  }

  .name-ar{font-family:'El Messiri',serif;font-size:34px;font-weight:700;margin-bottom:2px;}
  .name-en{font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;letter-spacing:5px;color:var(--ink-dim);margin-bottom:14px;}
  .bio{font-size:14px;color:var(--ink-dim);margin-bottom:32px;text-align:center;}

  .links{position:relative;width:100%;display:flex;flex-direction:column;gap:13px;}
  .links::before{
    content:'';
    position:absolute;
    top:-40px;left:50%;
    width:340px;height:calc(100% + 80px);
    transform:translateX(-50%);
    background:linear-gradient(180deg, rgba(255,201,120,.14), rgba(255,201,120,.03) 60%, transparent 100%);
    filter:blur(24px);
    z-index:-1;
    pointer-events:none;
  }

  .card{
    display:flex;align-items:center;gap:14px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:13px 16px;
    text-decoration:none;color:var(--ink);
    opacity:0;transform:translateY(18px);
    animation:up .6s ease forwards;
    transition:transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px);
    border-color:var(--card-border-hover);
    background:rgba(255,201,120,.09);
    box-shadow:0 8px 28px rgba(255,159,92,.18);
  }
  .card:focus-visible{outline:2px solid var(--glow); outline-offset:3px;}
  .card:nth-child(1){animation-delay:.05s}
  .card:nth-child(2){animation-delay:.15s}
  .card:nth-child(3){animation-delay:.25s}
  .card:nth-child(4){animation-delay:.35s}
  .card:nth-child(5){animation-delay:.45s}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  .icon{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 12px rgba(0,0,0,.3);
    animation:bob 3.4s ease-in-out infinite;
  }
  .icon svg{width:22px;height:22px;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .info{flex:1;min-width:0;text-align:right;}
  .pname{font-weight:700;font-size:15px;}
  .phandle{font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chev{opacity:.35;flex-shrink:0;transition:transform .22s ease,opacity .22s ease;color:var(--glow);}
  .card:hover .chev{transform:translateX(-4px);opacity:1;}

  .fb{background:var(--fb);}
  .ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);}
  .tt{background:#000;}
  .yt{background:var(--yt);}
  .dc{background:var(--dc);}

  .spark{
    margin-top:36px;
    font-size:16px;
    color:var(--glow);
    animation:sparkPulse 2.6s ease-in-out infinite;
  }
  @keyframes sparkPulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.15);}}

  @media(max-width:360px){
    .logo-badge img{height:110px;}
    .name-ar{font-size:29px;}
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  }
</style>
</head>
